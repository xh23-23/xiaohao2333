  const metrics=(n=0)=>`<dl class="ui-metrics"><div><dt>${n===0?'2025参保':'参保人数'}</dt><dd>${records[n][1]} 人</dd></div><div><dt>专利首页记录</dt><dd>${records[n][2]} 条</dd></div><div><dt>最近资本事项</dt><dd>未收录</dd></div></dl>`;
  const companyCard=(n=0,select=false)=>card('',`<div class="ui-company-top">${select?`<input type="checkbox" aria-label="选择${companyNames[n]}" ${n<2?'checked':''}>`:''}<div class="ui-company-symbol">${icon('building')}</div><div class="ui-company-info">${a('D02',companyNames[n],'ui-company-name')}<p>软件和信息技术服务业</p>${n===0?`<div class="ui-tags">${tag('高新技术企业')}${tag('专精特新中小企业')}</div>`:''}</div>${select?'':`<button class="ui-follow" data-follow="${n}" aria-pressed="false">${icon('star')}<span>关注</span></button>`}</div><p class="ui-company-meta">${records[n][0]} 年成立 · 注册在园</p>${metrics(n)}`);
  const companyTop=()=>`<div class="ui-company-intro"><div class="thinkplay">THINKPLAY</div><div><h1>${company}</h1><p>软件和信息技术服务业</p><div class="ui-tags">${tag('高新技术企业')}${tag('专精特新中小企业')}</div></div></div><div class="ui-actions"><button class="ui-button secondary" data-follow="0">${icon('star')}<span>关注企业</span></button>${btn('S14',icon('compare')+'加入对比',true)}</div>`;
  const detailTabs=id=>tabs([['D02','概览'],['S01','资料'],['S08','跟进']],id==='D02'?'D02':id==='S08'?'S08':'S01');
  const subTabs=id=>tabs(categories.map((c,i)=>[`S0${i+1}`,c]),id,'ui-subtabs');
  const research=()=>btn('S10',icon('sparkle')+'研究这家公司');
  function home(){return shell('通约',`<div class="ui-hero"><h1>查找企业，查看资料</h1><p>按行业筛选，了解企业基本情况。</p></div>${search()}<div class="ui-home-grid">${a('L04',icon('building')+'<strong>发现企业</strong><span>按行业和条件筛选</span>','ui-home-entry')}${a('S14',icon('compare')+'<strong>企业对比</strong><span>对比企业资料</span>','ui-home-entry')}</div>${a('P03',icon('chart')+'<span><strong>资金全景</strong><small>查看募资进度与项目投入</small></span>'+icon('arrow'),'ui-fund-entry')}<div class="ui-shortcuts">${a('S08',icon('people')+'企业走访')}${a('P11',icon('handshake')+'融资接洽')}${a('P05',icon('doc')+'我的报告')}</div><div class="ui-section-heading"><h2>关注动态</h2>${a('P09','查看全部 '+icon('arrow'))}</div>${empty('还没有关注企业','关注后，可在这里查看企业动态。',btn('L04','添加关注',true),'star')}<div class="ui-section-heading"><h2>我的关注方向</h2>${a('P07','调整 '+icon('arrow'))}</div><div class="ui-directions">${['工业软件','人工智能','集成电路'].map(tag).join('')}</div><div class="ui-composer"><label for="home-question">问通约</label><form data-chat><input id="home-question" placeholder="例如：帮我比较两家企业"><a href="#P07">本地资料</a><button aria-label="发送问题">${icon('send')}</button></form></div>`,{home:true,bottom:true});}
  function list(follow=false,selection=false){return shell('企业',`<div class="ui-section-heading"><h1>${selection?'选择对比企业':follow?'我的关注':'发现企业'}</h1>${selection?a('L04','退出选择','ui-link-button'):''}</div>${!follow&&!selection?'<p class="ui-lead">按行业和条件查找企业。</p>':''}${selection?'<p class="ui-lead">已选 2 家</p>':''}${search()}${selection?'':`<div class="ui-section-heading ui-small-heading"><span>企业名录 · 全部范围</span>${a('P08','资料来源 '+icon('arrow'))}</div><div class="ui-list-tools">${tabs([['L04','推荐'],['S13','我的关注'],['S11','报告']],follow?'S13':'L04')}${btn('P12',icon('filter')+'筛选',true)}</div><div class="ui-section-heading ui-small-heading"><span>${follow?'0 家关注企业':'200 家企业'}</span>${btn('S14',icon('compare')+'选择对比',true)}</div>`}${follow?card('',empty('还没有关注企业','关注的企业会保存在这里。',btn('L04','查看企业名录'),'star')):[0,1,2].map(n=>companyCard(n,selection)).join('')}${selection?`<div class="ui-selection-footer"><span>已选 <b>2</b> 家</span>${btn('S10','分别研究',true)}${btn('P01','开始对比')}</div>`:!follow?'<p class="ui-source center">未收录表示当前资料中暂无相关记录</p>':''}`,{home:true,bottom:!selection,active:'L04'});}
  function detail(id){let body='';if(id==='D02'){body=card('企业概况',metrics()+rows([['成立日期','2019-01-14'],['园区状态','注册在园'],['招投标记录','表内 0 条']])+source,a('S01','查看资料 '+icon('arrow')))+card('研究记录','<h3>暂无研究记录</h3><p>先查看企业资料，再整理需要核实的问题。</p>',a('S08','查看研究记录 '+icon('arrow')))+'<h2 class="ui-outside-title">走访准备</h2><p>整理产品、客户和融资方面的问题。</p>'+btn('P11',icon('doc')+'准备沟通提纲',true)+'<p class="ui-source">资料未提供不代表不存在相关事项</p>'+research();}
    else if(id==='S08'){body=card('跟进备注',`<form data-note><label for="follow-note">关注原因与下次联系安排</label><textarea id="follow-note" placeholder="记下待确认的问题和下次联系安排。"></textarea><button class="ui-button secondary" type="submit">保存备注</button></form>`)+card('研究记录',empty('暂无研究记录','',research()));}
    else {let content='';if(id==='S01')content=rows([['信用代码','91510100MA64NE6P83'],['成立日期','2019-01-14'],['企业类型','其他有限责任公司'],['法人','邱建生'],['注册地址','中国（四川）自由贸易试验区成都高新区世纪城路1129号3栋1单元1层1号'],['在园区内','是'],['园区三态','注册在园'],['行业','软件和信息技术服务业']])+`<div class="ui-tags">${['存续','小微企业','高新技术企业','专精特新中小企业'].map(tag).join('')}</div>`;
      if(id==='S02')content=rows([['注册资本（万）','300'],['实缴资本（万）','300'],['融资次数','0'],['最近融资','不可得'],['产业资本','否']])+'<h3>数据说明</h3><ul class="ui-notes"><li>注册资本、实缴资本未注明币种。</li><li>融资记录为历史信息，当前阶段需另行核实。</li></ul>';
      if(id==='S03')content=rows([['专利数（首页）','3 条'],['其中发明','3 条'],['知产方向','服务器、数据库对接、定时器'],['软著最近登记','2026-09-16']])+'<h3>统计范围</h3><p>这里只统计原表首页的专利记录，非全部专利。</p>';
      if(id==='S04')content=rows([['年报客户数','不可得'],['本地订单','无']])+'<p>原表未提供客户数量及交付明细。</p>';
      if(id==='S05')content=rows([['招投标记录数','0'],['近12月中标金额（万）','0']])+'<h3>统计范围</h3><p>招投标数量按原表统计，范围可能仅含首页记录。</p><p>“近12个月”的统计截止日期未提供。</p>';
      if(id==='S06')content=rows([['人员规模档','小于50人'],['参保人数（最新）','29 人（2025）'],['参保人数（上年）','不可得'],['社保趋势','缺少上年数据']])+'<p>缺少上年参保人数，暂无法比较年度变化。</p>';
      if(id==='S07')content=rows([['营收','不公示'],['利润','不公示'],['资产','不公示'],['对外投资数','0'],['风险信号','无'],['司法风险','未触发'],['数据完整度','4/8']])+'<p>完整度表示资料覆盖情况，不是企业评分。</p><p>司法情况需进一步核实。</p>';
      body=subTabs(id)+card(categories[Number(id.slice(1))-1],content+source)+research();}
    return shell('企业详情',companyTop()+detailTabs(id)+body,{back:'L04'});
  }
  function compare(){const r=[['成立日期','2019-01-14','2017-11-15',true],['登记行业','软件和信息技术服务业','软件和信息技术服务业'],['园区状态','注册在园','注册在园'],['参保人数','<strong>29 人</strong><small>2025 年</small>','<strong>1 人</strong><small>年份未提供</small>',true],['专利首页记录','<strong>3 条</strong>','<strong>0 条</strong>',true],['最近融资','未提供','未提供'],['招投标记录','表内 0 条','表内 0 条']];return shell('企业对比',`<div class="ui-section-heading"><div><h1>对比企业资料</h1><p>已选 2 家企业</p></div>${btn('S14',icon('swap')+'更换企业',true)}</div>${tabs([['P01','全部'],['P01','工商'],['P01','融资'],['P01','知产'],['P01','人员']],'P01')}<div class="ui-section-heading ui-small-heading"><label class="ui-switch"><input type="checkbox" data-differences>只看差异</label><span>蓝色标记表示差异</span></div><div class="ui-table-wrap"><table class="ui-compare"><thead><tr><th>信息维度</th><th>${companyNames[0]}</th><th>${companyNames[1]}</th></tr></thead><tbody>${r.map(([k,x,y,d])=>`<tr data-different="${!!d}"><th>${k}${d?'<span class="difference" aria-label="存在差异"></span>':''}</th><td>${x}</td><td>${y}</td></tr>`).join('')}</tbody></table></div>${source}${card('数据说明','<p>参保年份不全，人数不宜直接比较。</p><p>专利数仅统计原表首页记录。</p>')}${btn('S10',icon('doc')+'分别生成研究报告')}`,{back:'S14',bottom:true,active:'L04'});}
  function reports(has=false){return shell('研究报告',`<div class="ui-hero"><h1>研究报告</h1><p>共 ${has?1:0} 份</p></div><div class="ui-report-tabs" role="tablist">${['全部','不跟进','继续研究'].map((text,i)=>`<button role="tab" aria-selected="${i===0}" data-report-tab="${i}">${text}</button>`).join('')}</div><div data-report-content>${has?card('',`<div class="ui-report-entry">${icon('doc')}<div><h2>${company}｜企业研究报告</h2><p>继续研究 · 资料整理 · 2026/11/13</p></div></div><div class="ui-actions">${btn('S12','阅读报告')}${btn('S12','分享报告',true)}</div>`):card('',empty('还没有研究报告','选择企业后，即可生成研究报告。',btn('L04','选择企业')))}</div>`,{back:'H03'});}
  const settingRow=(id,name,i='arrow')=>a(id,`<span>${icon(i)}${name}</span>${icon('arrow')}`,'ui-setting-row');
  function workspace(){return shell('我的',`<div class="ui-profile"><span class="ui-profile-avatar">林</span><div><h1>我的</h1><p>关注企业、研究报告和个人设置。</p></div></div>${card('',`<div class="ui-workspace-metrics">${[['S13','关注企业','0'],['S11','研究报告','0'],['P07','关注方向','3']].map(([id,label,v])=>a(id,`<span>${label}</span><strong>${v}</strong>`)).join('')}</div>`)}${card('',settingRow('S13','我的关注','star')+settingRow('S11','研究报告','doc')+settingRow('P07','偏好与资料设置','filter')+settingRow('P08','资料来源','building'))}`);}
  function coverage(){return shell('资料来源',`<h1 class="ui-outside-title">已导入的企业资料</h1>${card('园区企业名录','<dl class="ui-metrics ui-coverage-metrics"><div><dt>注册在园</dt><dd>91</dd></div><div><dt>经营在园</dt><dd>57</dd></div><div><dt>园外</dt><dd>52</dd></div></dl>','<span>200 家企业</span>')}<h2 class="ui-outside-title">数据说明</h2>${card('',`<div class="ui-copy-block"><h3>基础信息</h3><p>企业名称、信用代码和园区分类来自企业名录。</p></div><div class="ui-copy-block"><h3>数据日期</h3><p>融资日期和参保年份按原始资料显示；缺失项标为未提供。</p></div><div class="ui-copy-block"><h3>资料完整度</h3><p>完整度表示资料覆盖情况，不是企业评分。</p></div>`)}<h2 class="ui-outside-title">暂缺信息</h2><p>暂无采集日期和单条来源链接。</p><p class="ui-source">导入的资料保存在当前浏览器。</p>`,{back:'P06'});}
  function updates(){return shell('企业动态',`<div class="ui-section-heading"><div><h1>企业动态</h1><p>0 条未读</p></div><button class="ui-text-button" data-read-all>全部已读</button></div>${tabs([['P09','全部'],['P09','研发进展'],['P09','资本动态'],['P09','入驻动态']],'P09')}${card('',empty('暂无企业动态','当前资料中没有企业动态记录。',btn('L04','查看企业'),'bell'))}`);}
  function history(){return shell('历史对话',`<h1 class="ui-outside-title">历史对话</h1>${card('',a('P11',icon('message')+'<strong>帮我准备一次企业走访，需要问哪些问题？</strong>'+icon('arrow'),'ui-history-row'))}${btn('P11',icon('plus')+'新建对话')}`);}
  function chat(){return shell('通约',`<div class="ui-user-message">帮我准备一次企业走访，需要问哪些问题？</div><div class="ui-assistant-message">${logo()}<p>走访时可以重点问：产品卖给谁、收入和回款如何、手头有哪些订单、是否有融资计划。下方是名录中的企业，可先查看资料。</p></div>${[0,1,2].map(n=>companyCard(n)).join('')}<p class="ui-source">资料来源：已导入的企业名录</p><form class="ui-chat-input" data-chat><label class="sr-only" for="chat-question">输入你的问题</label><textarea id="chat-question" placeholder="输入你的问题"></textarea><div><a href="#P07">${icon('attach')}本地资料</a><button aria-label="发送问题">${icon('send')}</button></div></form>`,{home:true,bottom:true});}
  function filter(){return shell('企业',`<section class="ui-sheet"><div class="ui-section-heading"><h1>筛选企业</h1>${a('L04',icon('close'),'icon-btn')}</div><p class="ui-lead">可同时选择多项条件。</p><form data-filter><fieldset><legend>园区位置</legend><div class="ui-choice-grid">${['注册在园','经营在园','园外'].map(t=>`<label><input type="checkbox">${t}</label>`).join('')}</div></fieldset><fieldset><legend>行业方向</legend>${['软件和信息技术服务业','广播、电视、电影和录音制作业','研究和试验发展'].map(t=>`<label class="ui-check-row"><input type="checkbox">${t}</label>`).join('')}<details><summary>展开其他行业</summary>${['零售业','建筑装饰、装修和其他建筑业','房地产业'].map(t=>`<label class="ui-check-row"><input type="checkbox">${t}</label>`).join('')}</details></fieldset><fieldset><legend>历史资本事项</legend><select aria-label="历史资本事项"><option>不限</option><option>A轮</option><option>B轮</option><option>拟收购</option></select><p class="ui-source">按记录的融资轮次或事项筛选。“拟收购”不表示已完成交易。</p></fieldset><fieldset><legend>参保人数</legend><div class="ui-input-pair"><input aria-label="最少参保人数" type="number" min="0" placeholder="不限"><span>至</span><input aria-label="最多参保人数" type="number" min="0" placeholder="不限"><span>人</span></div></fieldset><fieldset><legend>企业资质</legend><select aria-label="企业资质"><option>不限</option><option>高新技术企业</option><option>专精特新中小企业</option></select></fieldset><fieldset><legend>资本与业务</legend><label class="ui-check-row"><input type="checkbox">有产业资本</label><label class="ui-check-row"><input type="checkbox">有本地订单</label></fieldset><div class="ui-actions"><button type="reset" class="ui-button secondary">重置</button><button class="ui-button">查看企业</button></div></form></section>`,{back:'L04'});}
  function followSettings(){return shell('我的',`<section class="ui-sheet"><div class="ui-section-heading"><h1>我的偏好</h1>${a('P06',icon('close'),'icon-btn')}</div><p class="ui-lead">选择关注的行业，调整企业推荐。</p><h2 class="ui-outside-title">关注方向</h2><form data-preferences>${['软件和信息技术服务业','广播、电视、电影和录音制作业','研究和试验发展','零售业','建筑装饰、装修和其他建筑业','房地产业'].map(t=>`<label class="ui-check-row"><input type="checkbox" name="industry" value="${t}">${t}</label>`).join('')}<h2 class="ui-outside-title">企业资料</h2><div class="ui-upload-row"><div><strong>导入企业 CSV</strong><small>当前已导入 200 家企业</small></div>${btn('S17','选择文件',true)}</div>${settingRow('P08','查看资料来源')}<h2 class="ui-outside-title">AI 连接</h2><p>连接已有平台 AI，用于企业研究。</p>${btn('S15','连接平台 AI',true)}<p class="ui-source">偏好设置保存在当前浏览器。</p><button class="ui-button" type="submit">保存设置</button></form></section>`,{back:'P06'});}
